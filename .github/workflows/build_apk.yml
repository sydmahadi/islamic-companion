
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create . \
            --org com.sayeed \
            --project-name islamic_companion

      - name: Verify Android Manifest
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: islamic-companion-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
